<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AstrBot+ 控制台</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <main class="main">
        <header class="topbar">
          <div class="topbar-brand">
            <div class="brand">
              <svg class="brand-logo" viewBox="0 0 512 512" width="28" height="28" role="img" aria-label="AstrBot+">
                <defs>
                  <linearGradient id="abpLogoBg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#42a9e2" />
                    <stop offset="0.5" stop-color="#2f86bd" />
                    <stop offset="1" stop-color="#1a5c92" />
                  </linearGradient>
                  <linearGradient id="abpLogoMark" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffffff" />
                    <stop offset="1" stop-color="#dcefff" />
                  </linearGradient>
                </defs>
                <rect width="512" height="512" rx="116" fill="url(#abpLogoBg)" />
                <path d="M256 96 C266 176 336 246 416 256 C336 266 266 336 256 416 C246 336 176 266 96 256 C176 246 246 176 256 96 Z" fill="url(#abpLogoMark)" />
                <circle cx="382" cy="382" r="70" fill="#1a5c92" opacity="0.35" />
                <circle cx="382" cy="382" r="62" fill="#ffffff" />
                <path d="M382 350v64M350 382h64" stroke="#2f86bd" stroke-width="16" stroke-linecap="round" />
              </svg>
              <strong class="brand-name">AstrBot+</strong>
            </div>
            <div class="topbar-actions">
              <button class="btn" id="btn-reload">刷新</button>
              <button class="btn primary" id="btn-create" hidden></button>
            </div>
          </div>
          <div class="topbar-title">
            <h1 id="view-title">概览</h1>
            <p id="view-desc" class="muted"></p>
          </div>
        </header>

        <!-- 视图切换：置于标题下方 -->
        <nav class="tabs" id="nav-list" role="tablist" aria-label="视图切换">
          <button
            class="tab is-active"
            data-view="overview"
            role="tab"
            aria-selected="true"
          >
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.6" />
                <rect x="14" y="3" width="7" height="7" rx="1.6" />
                <rect x="3" y="14" width="7" height="7" rx="1.6" />
                <rect x="14" y="14" width="7" height="7" rx="1.6" />
              </svg>
            </span>
            <span class="tab-text">概览</span>
          </button>
          <button class="tab" data-view="users" role="tab" aria-selected="false">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="3.4" />
                <path d="M3 20c0-3 2.7-5.2 6-5.2s6 2.2 6 5.2" />
                <path d="M16.5 5.4a3.2 3.2 0 0 1 0 5.9" />
                <path d="M18 14.9c2 .8 3.3 2.5 3.3 4.6" />
              </svg>
            </span>
            <span class="tab-text">用户</span>
          </button>
          <button class="tab" data-view="agents" role="tab" aria-selected="false">
            <span class="tab-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.2l2.1 5.2 5.2 2.1-5.2 2.1-2.1 5.2-2.1-5.2L4.7 10.5l5.2-2.1z" />
                <path d="M18.4 16.6l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" />
              </svg>
            </span>
            <span class="tab-text">智能体</span>
          </button>
        </nav>

        <!-- 概览 -->
        <section class="view is-active" data-view="overview">
          <div class="tiles">
            <div class="tile">
              <span class="tile-label">注册用户</span>
              <strong id="stat-users">—</strong>
            </div>
            <div class="tile">
              <span class="tile-label">智能体</span>
              <strong id="stat-agents">—</strong>
            </div>
            <div class="tile">
              <span class="tile-label">今日消息</span>
              <strong id="stat-today">—</strong>
            </div>
            <div class="tile">
              <span class="tile-label">在线连接</span>
              <strong id="stat-online">—</strong>
            </div>
          </div>
        </section>

        <!-- 用户 -->
        <section class="view" data-view="users">
          <div class="table-card">
            <table class="table" id="table-users">
              <thead>
                <tr>
                  <th>邮箱</th>
                  <th>用户名</th>
                  <th>创建时间</th>
                  <th>状态</th>
                  <th>可用智能体</th>
                  <th>Token 用量</th>
                  <th class="col-ops">操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <!-- 智能体 -->
        <section class="view" data-view="agents">
          <div class="table-card">
            <table class="table" id="table-agents">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>显示名</th>
                  <th>备注</th>
                  <th>指纹</th>
                  <th>状态</th>
                  <th class="col-ops">操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="foot-hint">新建智能体会在平台配置中追加一个 astrbot_plus 适配器并即时热加载。</p>
        </section>

        <footer class="page-foot">
          <span class="ver" id="ver">—</span>
        </footer>
      </main>
    </div>

    <!-- 右侧抽屉：新建 / 编辑 -->
    <div class="drawer-layer" id="drawer" hidden>
      <div class="drawer-scrim" data-close="1"></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-head">
          <h2 id="drawer-title">标题</h2>
          <button class="icon-btn" data-close="1" aria-label="关闭">✕</button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
        <footer class="drawer-foot">
          <button class="btn" data-close="1">取消</button>
          <button class="btn primary" id="drawer-submit">确定</button>
        </footer>
      </aside>
    </div>

    <!-- 确认框 -->
    <div class="dialog-layer" id="dialog" hidden>
      <div class="dialog-scrim" data-close="1"></div>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
        <h3 id="dialog-title">确认</h3>
        <p id="dialog-text" class="muted"></p>
        <div class="dialog-foot">
          <button class="btn" data-close="1">取消</button>
          <button class="btn danger" id="dialog-ok">确定</button>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
