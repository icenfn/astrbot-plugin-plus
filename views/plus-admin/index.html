<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AstrBot+ 管理</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="tabs">
  <button class="tab active" data-tab="overview">总览</button>
  <button class="tab" data-tab="users">用户管理</button>
  <button class="tab" data-tab="agents">Agent 管理</button>
</div>

<section id="tab-overview" class="pane active">
  <div class="cards">
    <div class="card"><div class="num" id="stat-users">-</div><div class="lbl">注册用户</div></div>
    <div class="card"><div class="num" id="stat-agents">-</div><div class="lbl">Agent 总数</div></div>
    <div class="card"><div class="num" id="stat-today">-</div><div class="lbl">今日消息</div></div>
    <div class="card"><div class="num" id="stat-online">-</div><div class="lbl">在线连接</div></div>
  </div>
</section>

<section id="tab-users" class="pane">
  <div class="bar">
    <h3>用户列表</h3>
    <button id="btn-new-user" class="primary">新建用户</button>
  </div>
  <table id="users-table">
    <thead><tr>
      <th>邮箱</th><th>用户名</th><th>创建时间</th><th>状态</th><th>可用 Agent 数</th><th>Token</th><th>操作</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>

<section id="tab-agents" class="pane">
  <div class="bar">
    <h3>Agent 列表</h3>
    <button id="btn-new-agent" class="primary">新建 Agent</button>
  </div>
  <table id="agents-table">
    <thead><tr>
      <th>ID</th><th>Botname</th><th>启用</th><th>操作</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-body">
    <h3 id="modal-title"></h3>
    <div id="modal-content"></div>
    <div class="modal-actions">
      <button id="modal-cancel">关闭</button>
      <button id="modal-ok" class="primary">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
